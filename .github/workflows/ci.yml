name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci && npm run typecheck && npm test && npm run validate
      - run: npx tsc --noEmit -p mobile
      - run: npm test -w @evacuai/mobile -- --ci
      - run: npx expo lint
        working-directory: mobile
      - run: npm run snapshots && git diff --exit-code campus-data/*.snapshot.json
      - run: npm run build:3d && git diff --exit-code api/public/js/campus-3d.js

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: evacuai_test
          POSTGRES_USER: evacuai
          POSTGRES_PASSWORD: evacuai
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U evacuai" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, bcmath, gd, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/pest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp docker/.env.example docker/.env
      - run: docker compose -f docker/compose.yml up -d --build --wait app
      - run: curl -fsS http://localhost:8000/up
      - run: docker compose -f docker/compose.yml exec -T postgres psql -U evacuai -tAc "select count(*) from evac_nodes" | grep -qv '^0$'
      - if: failure()
        run: docker compose -f docker/compose.yml logs app
