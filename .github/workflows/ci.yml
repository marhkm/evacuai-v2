name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci && npm run typecheck && npm test && npm run validate
      - run: npx tsc --noEmit -p mobile
      - run: npm test -w @evacuai/mobile -- --ci
      - run: npx expo lint
        working-directory: mobile
      - run: npx tsc --noEmit -p command && npm test -w command && npm run build -w command # Command Center
      - run: npm run snapshots && git diff --exit-code campus-data/*.snapshot.json
      - run: npm run build:3d && git diff --exit-code api/public/js/campus-3d.js
      - run: npm run manual && git diff --exit-code docs/user-manual.html
      # Floor-plan importer self-test on a synthetic poster (the real PDFs are never in the repository).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.26.4 && python -I campus-data/tools/test_import_pdf_plan.py

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: evacuai_test
          POSTGRES_USER: evacuai
          POSTGRES_PASSWORD: evacuai
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U evacuai" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, bcmath, gd, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/pest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp docker/.env.example docker/.env
      - run: docker compose -f docker/compose.yml up -d --build --wait app reverb mobile-web
      - run: curl -fsS http://localhost:8000/up
      - run: curl -fsS http://localhost:8000/command/ | grep -q 'id="root"' # the Command Center is built into the image
      - run: docker compose -f docker/compose.yml exec -T postgres psql -U evacuai -tAc "select count(*) from evac_nodes" | grep -qv '^0$'
      # Browser smoke tests against the built stack (production web build + admin panel).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 10 # a stuck browser download fails fast instead of hanging for hours
      - run: npm run e2e
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - if: failure()
        run: docker compose -f docker/compose.yml logs app
